name: Build CHAVSV

on:
  push:
    branches:
      - main
      - Windows
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - Windows
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck and build frontend
        run: npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller==6.11.1

      - name: Test encryption compatibility
        run: python -m unittest discover -s tests -v

      - name: Build Python backend
        shell: powershell
        run: |
          pyinstaller backend/backend.spec --noconfirm --clean
          New-Item -ItemType Directory -Force -Path src-tauri/resources
          if (Test-Path "dist/backend.exe") {
            Copy-Item -Path "dist/backend.exe" -Destination "src-tauri/resources/backend.exe" -Force
          } elseif (Test-Path "backend/dist/backend.exe") {
            Copy-Item -Path "backend/dist/backend.exe" -Destination "src-tauri/resources/backend.exe" -Force
          } else {
            throw "backend.exe was not found after PyInstaller build"
          }

      - name: Build Tauri application
        run: npm run tauri:build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CHAVSV-Windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
